[project]
name = "memescan"
version = "0.1.0"
description = "Defensive Memecoin-Sicherheits-Scanner und Launch-Archiver (Rug-/Scam-Erkennung)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memescan = "memescan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
