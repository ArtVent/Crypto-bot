# Paper-Trading-Lauf auf GitHub-Actions-Runnern (freier Netzzugang):
# zeichnet den PumpPortal-Live-Strom auf, spielt ihn als A/B (Referenz vs.
# Bot-Dichte-Kappe) lookahead-frei durch den Bot und veröffentlicht
# Aufzeichnung + Bericht als GitHub-Release. Es fließt KEIN echtes Geld,
# es werden KEINE Keys benötigt. Telegram-Bericht ist optional
# (Repo-Secrets TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID).
#
# Hinweis Minuten-Budget: privates Repo = 2.000 kostenlose Minuten/Monat.
# Ein täglicher 50-Minuten-Lauf braucht ~1.600/Monat. Öffentliches Repo
# hätte keine Minutenbegrenzung auf Standard-Runnern.
name: paper-trading

on:
  # Haupt-Trigger: jede Änderung an .github/paper-trigger startet einen Lauf
  # (funktioniert auf jedem Branch – die Datei enthält die Aufnahmedauer).
  push:
    branches: ["claude/memecoin-database-github-sjwlmb"]
    paths: [".github/paper-trigger"]
  # Nur wirksam, wenn der Workflow auf dem Default-Branch liegt:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Aufnahme-Dauer in Minuten"
        required: false
        default: "50"
  schedule:
    # 19:17 UTC = aktive US-Stunden auf pump.fun.
    - cron: "17 19 * * *"

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  record-and-abtest:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installieren
        run: pip install -e .

      - name: Live-Strom aufzeichnen
        run: |
          minutes="${{ github.event.inputs.minutes || '' }}"
          if [ -z "$minutes" ] && [ -f .github/paper-trigger ]; then
            minutes=$(grep -oE '^[0-9]+' .github/paper-trigger | head -1)
          fi
          minutes="${minutes:-50}"
          echo "Aufnahmedauer: ${minutes} Minuten"
          echo "REC_MINUTES=$minutes" >> "$GITHUB_ENV"
          python -m memetrader record --minutes "$minutes" --out recording.jsonl

      - name: Aufnahme prüfen
        run: |
          n=$(wc -l < recording.jsonl)
          min_events=$(( REC_MINUTES * 10 ))   # toter Stream soll den Lauf rot machen
          echo "Events aufgezeichnet: $n (Minimum: $min_events)"
          test "$n" -ge "$min_events"

      - name: A/B-Replay (Referenz vs. Kappe vs. Leiter)
        run: |
          python -m memetrader abtest recording.jsonl --out-dir report
          echo "PAPER_TAG=paper-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      # Bericht ZUERST ins Repo sichern – überlebt einen Release-Fehlschlag
      - name: Bericht ins Repo committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          cp report/report.md "reports/${PAPER_TAG}.md"
          cp report/report.json "reports/${PAPER_TAG}.json"
          git add reports/
          git commit -m "paper-trading: Bericht ${PAPER_TAG}"
          # Falls parallel gepusht wurde: einmal nachziehen (Berichte kollidieren nie)
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Release veröffentlichen
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -9 recording.jsonl
          files="recording.jsonl.gz report/report.json"
          # Journale existieren nur, wenn Trades stattfanden
          for arm in ref cap ladder; do
            [ -f "report/$arm/bt_1.journal.jsonl" ] && cp "report/$arm/bt_1.journal.jsonl" "journal-$arm.jsonl" && files="$files journal-$arm.jsonl"
          done
          gh release create "$PAPER_TAG" \
            --target "${{ github.sha }}" \
            --title "Paper-Trading $PAPER_TAG" \
            --notes-file report/report.md \
            $files

      - name: "Fallback: Aufzeichnung als Artifact sichern"
        if: steps.release.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: recording-${{ env.PAPER_TAG }}
          path: |
            recording.jsonl.gz
            report/report.json
          retention-days: 30

      - name: Telegram-Bericht (optional)
        if: success()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Telegram nicht konfiguriert – übersprungen."
            exit 0
          fi
          text=$(head -c 3500 report/report.md)
          curl -fsS "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode chat_id="$CHAT" \
            --data-urlencode text="$text" >/dev/null
          echo "Telegram-Bericht gesendet."

      - name: Release-Fehlschlag als rot markieren
        if: steps.release.outcome == 'failure'
        run: |
          echo "Release fehlgeschlagen (403?) – Bericht ist committet, Aufzeichnung als Artifact gesichert."
          exit 1
